<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graphify.CSharp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="command-bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <div class="brand-title">Graphify.CSharp</div>
          <div id="meta" class="brand-meta">Loading graph…</div>
        </div>
      </div>

      <div class="command-search">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Search symbols, types, methods…" autocomplete="off" />
        <kbd>↵</kbd>
      </div>

      <div class="command-actions">
        <label class="control-pill">
          <span>Depth</span>
          <input id="depth" type="range" min="1" max="4" value="2" />
          <strong id="depthValue">2</strong>
        </label>
        <label class="toggle-pill">
          <input id="justMyCode" type="checkbox" checked />
          <span>My code only</span>
        </label>
        <button id="reloadBtn" type="button" class="ghost-btn">Reload</button>
      </div>
    </header>

    <main class="workspace">
      <section class="canvas-wrap">
        <div id="graph" tabindex="0" aria-label="Knowledge graph canvas"></div>

        <div class="canvas-overlay top-right">
          <div class="zoom-toolbar" aria-label="Zoom controls">
            <button id="zoomInBtn" type="button" title="Zoom in (+)">+</button>
            <button id="zoomOutBtn" type="button" title="Zoom out (−)">−</button>
            <button id="zoomFitBtn" type="button" title="Fit (F)">Fit</button>
            <button id="zoomResetBtn" type="button" title="Reset (0)">0</button>
          </div>
        </div>

        <div class="canvas-overlay bottom-left">
          <div id="relationFilters" class="relation-chips" aria-label="Relation filters"></div>
        </div>

        <div id="legend" class="canvas-overlay bottom-right legend-card" aria-live="polite"></div>
      </section>

      <aside class="inspector">
        <section class="inspector-section">
          <div class="section-head">
            <h2>Results</h2>
            <span class="section-hint">Enter to search</span>
          </div>
          <ul id="searchResults" class="result-cards"></ul>
        </section>

        <section class="inspector-section inspector-section-grow">
          <div class="section-head">
            <h2>Inspector</h2>
          </div>
          <div id="nodeDetail" class="node-detail empty">
            <div class="empty-state">
              <div class="empty-icon">◎</div>
              <p>Select a node to explore callers, callees, and references.</p>
            </div>
          </div>
        </section>
      </aside>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
